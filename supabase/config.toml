# Supabase Project Configuration
# This file is used by the Supabase CLI

[api]
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API endpoints.
schemas = ["public", "storage"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a view, table, or stored procedure. Limits payload size.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# The database major version to use. This has to be the same as your remote database's.
major_version = 15

[studio]
# Port to use for Supabase Studio.
port = 54323

[inbucket]
# Port to use for the email testing server (inbucket).
port = 54324

[storage]
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MB"

[auth]
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used in emails.
# Plugin app lives on subdomain plugin.sona.audio, landing page on sona.audio
site_url = "https://plugin.sona.audio"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://plugin.sona.audio", "https://sona.audio", "http://localhost:5173"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 seconds (one week).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email addresses.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false

# Edge Functions configuration
[functions.generate]
# Disable gateway JWT verification - we handle auth in the function itself
# This allows more flexibility and better error messages
verify_jwt = false

[functions.enhance-prompt]
# Disable gateway JWT verification - we handle auth in the function itself
verify_jwt = false

[functions.submit-report]
# Disable gateway JWT verification - we handle auth in the function itself
verify_jwt = false

[functions.stripe-checkout]
# Disable gateway JWT verification - we handle auth in the function itself
verify_jwt = false

[functions.stripe-webhook]
# Webhooks don't have user JWT - they use Stripe signature verification
verify_jwt = false

[functions.beta-approval]
# Admin-only function - should be called from admin dashboard with service role
# Could add additional auth checks in the function
verify_jwt = false

[functions.send-report-response]
# Admin-only function - should be called from admin dashboard with service role
# Could add additional auth checks in the function
verify_jwt = false
